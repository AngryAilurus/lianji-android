apply plugin: 'com.android.application'

android {
    namespace 'cn.lianji.training'
    compileSdk 36
    defaultConfig {
        applicationId 'cn.lianji.training'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.3.0'
        testInstrumentationRunner 'cn.lianji.training.TestRunner'
    }
    signingConfigs {
        personal {
            storeFile rootProject.file('signing.jks')
            storePassword 'android'
            keyAlias 'lianji'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.personal }
        release {
            signingConfig signingConfigs.personal
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
